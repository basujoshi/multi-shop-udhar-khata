<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Ledger • KhataPro</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand mini" href="dashboard.html"><span class="brandmark">K</span><span>KhataPro</span></a><div class="top-right"><select id="languageSelect" class="lang"><option value="en">EN</option><option value="ne">ने</option></select><a class="ghost" href="customers.html" data-i18n="customers">Customers</a></div></header><main class="wrap"><section id="customerHead" class="hero">Loading...</section><section class="stats"><div class="stat"><small data-i18n="totalCredit">Total Credit</small><strong id="credit">रू 0</strong></div><div class="stat"><small data-i18n="totalPaid">Total Paid</small><strong id="paid" class="green">रू 0</strong></div><div class="stat"><small data-i18n="remaining">Remaining Balance</small><strong id="due" class="red">रू 0</strong></div></section><section class="panel"><div class="panel-head"><h2 data-i18n="transactionsTitle">Transactions</h2><div class="top-right"><button id="notifyBtn" class="secondary">🔔 <span data-i18n="sendNotification">Notify</span></button><button id="paymentBtn" class="secondary">💵 <span data-i18n="addPayment">Add Payment</span></button><button id="entryBtn" class="primary">＋ <span data-i18n="addCredit">Add Credit</span></button></div></div><div id="entries" class="tablewrap transaction-table"></div></section><div id="modal" class="modal hidden"><div class="modalbox"><button class="close" id="close">×</button><h2 id="modalTitle">Add</h2><form id="entryForm"><label><span data-i18n="item">Item / Note</span><input id="item" required></label><label id="qtyWrap"><span data-i18n="quantity">Quantity</span><input id="qty" type="number" step="0.01" min="0.01" value="1"></label><label id="mrpWrap"><span data-i18n="mrp">MRP</span><input id="mrp" type="number" step="0.01" min="0.01"></label><label><span id="totalLabel" data-i18n="amount">Amount</span><input id="amount" type="number" step="0.01" min="0.01" required></label><label><span data-i18n="date">Date</span><input id="date" type="date" required></label><button class="primary" style="width:100%" type="submit" data-i18n="saveEntry">Save Entry</button></form></div></div><div id="notifyModal" class="modal hidden"><div class="modalbox"><button class="close" id="notifyClose">×</button><h2 data-i18n="sendNotification">Send Notification</h2><form id="notifyForm"><label><span data-i18n="notificationTitle">Title</span><input id="notifyTitle" placeholder="KhataPro"></label><label><span data-i18n="notificationMessage">Message</span><textarea id="notifyMessage" rows="4" required></textarea></label><button class="primary" style="width:100%" type="submit" data-i18n="sendNotification">Send Notification</button></form></div></div></main><nav class="mobile-nav"><a href="dashboard.html"><span>⌂</span><span data-i18n="home">Home</span></a><a href="customers.html"><span>👥</span><span data-i18n="customers">Customers</span></a><a href="add-customer.html"><span>＋</span><span data-i18n="addCustomer">Add</span></a><a href="reports.html"><span>▦</span><span data-i18n="reports">Reports</span></a><a href="shop-settings.html"><span>⚙</span><span data-i18n="settings">Settings</span></a></nav><script type="module" src="js/customer.js"></script></body></html>
