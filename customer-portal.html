<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal • KhataPro</title><link rel="stylesheet" href="css/style.css"></head><body class="customer-bg"><header class="customer-nav"><a href="index.html" class="portal-brand">K <span data-i18n="account">My Account</span></a><select id="languageSelect" class="lang"><option value="en">English</option><option value="ne">नेपाली</option></select></header><main class="wrap narrow"><section class="customer-hero"><div class="portal-icon">🔐</div><span class="portal-badge" data-i18n="secure">Private & secure access</span><h1 data-i18n="customerPortalTitle">Secure Customer Portal</h1><p class="hint" data-i18n="portalSubtitle">Use your registered mobile number and private PIN to access your account.</p><form id="lookup" class="portal-form"><label><span data-i18n="mobile">Mobile number</span><input id="mobile" required inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX"></label><label><span data-i18n="pin">6-digit PIN</span><input id="pin" required inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="••••••"></label><button class="primary" type="submit" data-i18n="continue">Continue</button><p class="privacy">🔒 Mobile number alone does not reveal any shop, balance or account data.</p></form></section><section id="results" class="portal-result"></section><section id="view" class="hidden portal-result"></section></main><script type="module">
import {db,cleanMobile} from './js/firebase-config.js';
import {ref,get} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
import {initLanguage,t,money,esc} from './js/common.js';
initLanguage();
const form=document.querySelector('#lookup'),results=document.querySelector('#results'),view=document.querySelector('#view');
const hashText=async text=>{const data=new TextEncoder().encode(text),hash=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')};
form.onsubmit=async e=>{e.preventDefault();view.classList.add('hidden');results.classList.remove('hidden');results.innerHTML=`<div class="panel">${t('checking')}</div>`;const mobile=cleanMobile(document.querySelector('#mobile').value),pin=document.querySelector('#pin').value.trim();if(mobile.length<7||!/^[0-9]{6}$/.test(pin)){results.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b><br>${t('checkDetails')}</div>`;return}try{const key=await hashText(mobile+'|'+pin),data=(await get(ref(db,`customerAccess/${key}`))).val();if(!data||data.enabled!==true){results.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b><br>${t('checkDetails')}</div>`;return}const shops=Object.entries(data.shops||{}).filter(([,x])=>x&&x.account&&cleanMobile(x.account.mobile)===mobile);if(!shops.length){results.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b><br>${t('checkDetails')}</div>`;return}results.innerHTML=`<div class="panel"><h2>${t('selectShop')}</h2><div class="customer-grid">${shops.map(([uid,x])=>`<button class="customer-card" data-uid="${uid}"><div class="avatar shop-photo-avatar">${x.shopPhoto?`<img src="${esc(x.shopPhoto)}" alt="${esc(x.shopName||t('shop'))}">`:'🏪'}</div><div><h3>${esc(x.shopName||t('shop'))}</h3><small>${t('viewAccount')}</small></div><strong>›</strong></button>`).join('')}</div></div>`;document.querySelectorAll('[data-uid]').forEach(b=>b.onclick=()=>showAccount(b.dataset.uid,data.shops[b.dataset.uid],mobile));}catch(err){results.innerHTML=`<div class="result-error">${t('error')}</div>`}};
function showAccount(uid,shopData,mobile){results.classList.add('hidden');view.classList.remove('hidden');const customer=shopData?.account;if(!customer||cleanMobile(customer.mobile)!==mobile){view.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b></div>`;return}let total=0,paid=0,rows='';Object.values(customer.transactions||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(x=>{if(x.type==='credit')total+=Number(x.amount)||0;else paid+=Number(x.amount)||0;const qty=Number(x.qty)||1;const mrp=x.type==='credit'?(Number(x.amount)||0)/qty:0;rows+=`<tr><td>${esc(formatDateTime(x.createdAt,x.date))}</td><td>${esc(x.item||t('payment'))}</td><td>${x.type==='credit'?money(mrp):'—'}</td><td>${x.type==='credit'?esc(qty):'—'}</td><td class="${x.type==='credit'?'credit':'paid'}">${x.type==='credit'?money(x.amount):'-'+money(x.amount)}</td></tr>`});const notes=Object.entries(shopData.notifications||{}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));const noteHtml=notes.length?notes.map(([id,n])=>`<div class="panel" style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:12px"><strong>🔔 ${esc(n.title||t('notification'))}</strong><small>${esc(formatDateTime(n.createdAt,''))}</small></div><p>${esc(n.message||'')}</p></div>`).join(''):`<div class="empty">${t('noNotifications')}</div>`;view.innerHTML=`<button class="ghost back" id="back">← ${t('back')}</button><section class="panel account-box"><p class="eyebrow">${t('account')}</p><div class="account-top"><div class="portal-shop-head"><div class="portal-shop-photo">${shopData.shopPhoto?`<img src="${esc(shopData.shopPhoto)}" alt="${esc(shopData.shopName||t('shop'))}">`:'🏪'}</div><div><h1>${esc(shopData.shopName||t('shop'))}</h1><p>${esc(customer.name||'')} • ${esc(customer.mobile||'')}</p></div></div><span class="portal-badge">${t('balance')}: ${money(total-paid)}</span></div><div class="stats"><div class="stat"><small>${t('totalCredit')}</small><strong>${money(total)}</strong></div><div class="stat"><small>${t('totalPaid')}</small><strong class="green">${money(paid)}</strong></div><div class="stat"><small>${t('remaining')}</small><strong class="red">${money(total-paid)}</strong></div></div><h2>${t('history')}</h2><div class="tablewrap transaction-table"><table><thead><tr><th>${t('dateTime')}</th><th>${t('item')}</th><th>${t('mrp')}</th><th>${t('quantity')}</th><th>${t('total')}</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">${t('noTransactions')}</td></tr>`}</tbody></table></div></section><section><h2 style="margin-top:22px">🔔 ${t('notifications')}</h2>${noteHtml}</section>`;document.querySelector('#back').onclick=()=>{view.classList.add('hidden');results.classList.remove('hidden')};if(notes.length){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.12)}catch(e){}}}
function formatDateTime(ts,date){const d=ts?new Date(ts):new Date((date||new Date().toISOString().slice(0,10))+'T00:00:00');return d.toLocaleString(localStorage.getItem('khata_lang')==='ne'?'ne-NP':'en-IN',{dateStyle:'short',timeStyle:'short',hour12:true})}
window.addEventListener('languageChanged',()=>location.reload());
</script></body></html>
